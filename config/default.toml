# CMeles default configuration.
#
# Every section is optional: a missing key falls back to the built-in
# default (see src/config/Config.hpp). This file documents the schema and
# the default values.

# ---- DG basis ----
[basis]
order = 2                 # Polynomial order N of the DG approximation space.
                          # Kernel capacity limit: N <= 4, because the modal
                          # count (N+1)(N+2)/2 must stay <= kMaxModes = 16
                          # (src/common/Constants.hpp; enforced at startup).
nq = 4                    # Gauss-Legendre quadrature points per dimension N_q.
                          # Kernel capacity limit: nq <= 6 (kMaxQuadPts1D,
                          # enforced at startup). N+1 already integrates the
                          # linear (mass/projection) terms exactly; the N+2
                          # used here is the anti-aliasing margin.

# ---- Structured mesh ----
[mesh]
nx = 8                    # Elements in x.
ny = 8                    # Elements in y.
x0 = 0.0                  # Lower-left corner x.
y0 = 0.0                  # Lower-left corner y.
dx = 1.0                  # Element size in x.
dy = 1.0                  # Element size in y.
shear = 0.0               # Horizontal shear offset per row (parallelogram grid).
split_triangles = false   # Split each quad into two triangles.

# ---- Riemann solver / numerical flux ----
[riemann]
flux = "llf"              # "llf" (implemented); roe/roe-e/steger-warming/van-leer reserved.

# ---- Gas model ----
[gas]
gamma = 1.4               # Ratio of specific heats.

# ---- Flow (initial / reference state) ----
[flow]
rho = 1.0                 # Reference density.
u = 0.0                   # Reference x-velocity.
v = 0.0                   # Reference y-velocity.
p = 1.0                   # Reference pressure.
mach = 0.1                # Reference Mach number (used for non-dimensionalisation).

# ---- Boundary condition ----
[bc]
type = "farfield"          # "farfield" (free-stream exterior state) | "periodic"
                           # (translation-paired periodic boundaries; requires
                           #  the mesh boundaries to match under (Lx,0)/(0,Ly))
                           # | "free" (zero-gradient: exterior copies the
                           #  interior trace; neutral while the wall-adjacent
                           #  flow is constant — but acoustically reflective:
                           #  outgoing pressure waves bounce back and tangential
                           #  wall flows can pile up non-physical compression)
                           # | "free-avg" (zero-gradient from the CELL MEAN:
                           #  exterior = the interior polynomial's constant
                           #  mode — the finite-volume edge-pad; unlike the
                           #  pointwise "free" trace it carries no high-order
                           #  oscillation into the wall flux when a shock
                           #  crosses the wall cell)
                           # | "riemann" (characteristic / pressure far-field
                           #  non-reflecting boundary, aliases "characteristic",
                           #  "pressure-farfield": the boundary state mixes the
                           #  interior trace with a reference state through the
                           #  normal acoustic invariants — outgoing waves leave
                           #  without reflection, subsonic outflow anchors only
                           #  the pressure to the reference; supersonic flows
                           #  pass through unchanged). General workloads set
                           #  the reference via [flow] (rho, u, v, p), exactly
                           #  like a Fluent pressure-outlet / SU2 far-field.
riemann_target = "flow"    # Reference state of the "riemann" bc: "flow" (the
                           # constant [flow] state — the standard usage) |
                           # "ic" (the trace of the initial field at each
                           # boundary point, for benchmark problems whose
                           # ambient environment varies along the walls, e.g. the
                           # four-quadrant 2-D Riemann data; a frozen
                           # snapshot of the initial solution) | "expr" (the
                           # [bc] rho/u/v/p expressions evaluated at the
                           # boundary point (x, y, t) and refreshed every
                           # time step — analytic wall data, e.g. the exact
                           # self-similar 1-D Riemann states of the 2-D
                           # Riemann problem; anchors the incoming acoustic
                           # invariant to a state that follows the moving
                           # waves while the outgoing information still
                           # leaves freely).
# Two more boundary types: "slip" (aliases "slip-wall", "wall" — reflection
# wall: the exterior state mirrors the interior trace with the normal
# momentum negated, giving exactly zero wall-normal mass flux; the inviscid
# wall condition) and "expr" (alias "dirichlet" — Dirichlet boundary from
# the rho/u/v/p expressions below, evaluated at (x, y, t) on every boundary
# quadrature point and refreshed once per time step; exact inflow / moving
# analytic boundary data).
#
# Per-side overrides (optional): boundary faces are assigned to a side by
# their outward normal; a side table's type replaces the global type there
# (periodic is global and cannot be overridden per side). The optional
# split_x / split_type switch the type for faces whose centroid x lies
# left of split_x — e.g. the Double-Mach floor:
#   [bc.y_low]
#   type = "slip"              # reflection wall behind the shock foot
#   split_x = 0.16666666666666666
#   split_type = "expr"        # post-shock inflow ahead of it
# Expressions for "expr" faces (x, y, t and gamma available; required when
# any side resolves to "expr"):
#rho = "1.4"
#u = "0.0"
#v = "0.0"
#p = "1.0"

# ---- Time marching ----
[time_marching]
method = "ssprk3"          # "euler" | "ssprk3" | "rk32" | "rk54" | "ssprk221"
                           # | "ssprk321" | "ssprk332" | "ssprk432" (embedded
                           # adaptive pairs) | "be" | "ditr_u2r2" | "ditr_u2r1"
                           # | "ditr_u3r1" (implicit, dual time stepping).
cfl = 0.2                  # CFL number: dt = CFL * min_K h_K / ((2N+1) * Lam_max).
dt = 0.0                   # Fixed time step; > 0 overrides the CFL estimate.
t_final = 1.0              # Final physical time.
rtol = 1e-6                # Relative tolerance (adaptive RK / dual-time convergence).
atol = 1e-6                # Absolute tolerance (adaptive RK / dual-time convergence).
safety = 0.9               # PI-controller safety factor (adaptive RK step size;
                           # also the dual-time pseudo stepper).
min_factor = 0.2           # Minimum step-size shrink factor applied on rejection.
max_factor = 5.0           # Maximum step-size growth factor per accepted step
                           # (must be >= min_factor).
max_growth = 10.0          # Step-size cap: max_growth * initial step.
max_pseudo_steps = 100     # Pseudo-time step cap per physical step (dual time).
pseudo_stagnation = false # Early-exit the pseudo iteration on residual
                           # stagnation (10 consecutive iterations without a 2%
                           # drop below the best-so-far). The strict positivity
                           # projection can pin the march on an
                           # admissibility-boundary fixed point, after which
                           # further iterations change nothing; the exit
                           # publishes the same state the max-steps cap would,
                           # ~3x faster. Off by default (classic semantics).
pseudo_stagnation_tol = 0.98 # Improvement threshold of the stagnation exit:
                           # an iteration counts as progress only if the
                           # residual drops below tol x best-so-far. Any value
                           # in [0.90, 0.995] separates the frozen phase from
                           # the slow tail (see DualStepper.hpp); stricter
                           # values ride the tail longer.
pseudo_norm = "inf"        # Convergence norm of the dual-time pseudo residual:
                           # "inf" (default; single worst DOF — strictest, but
                           # a point singularity can block it), "l2" (RMS
                           # per-DOF level, the standard CFD residual monitor,
                           # robust to isolated outlier DOFs), "mean" (mean
                           # |f|, similar robustness, looser). Same rtol/atol
                           # semantics for all variants.
pseudo_method = "ssprk332" # Pseudo stepper for dual time stepping (embedded RK).
pseudo_dt = 0.0            # Fixed pseudo step; <= 0 means adaptive (takes
                           # precedence over pseudo_dt_mode).
# pseudo_rtol = 1e-6       # Pseudo-stepper local error tolerance override
#                           # (dual time, adaptive pseudo mode). Unset = auto
#                           # heuristic (1e-3, both precisions).
# pseudo_atol = 1e-6       # Same override for the absolute tolerance.
pseudo_dt_mode = "global"  # Adaptive pseudo-dt granularity (dual time):
                           # "global" — single scalar dt, RMS-based PI
                           # controller; "local" — one pseudo dt per modal
                           # coefficient (per-DOF PI controller).
pseudo_reject = false      # Allow pseudo-step retry on rejection (default: forced accept).
dual_decoupled = false     # Decoupled per-stage pseudo steppers (DITR only; rejected with "be").

# ---- Discontinuity limiter ----
[limiter]
type = "none"              # "none" (the default; unlimited) | "mr-weno"
                           # (multi-resolution WENO limiter, applied after
                           # every RK stage state / implicit stage publish —
                           # see docs/tech_docs/mr_weno_limiter.md).
ckc = 1.0                  # KXRCF troubled-cell threshold C_k.
shock_norm = "min"         # KXRCF boundary-value normalisation: "min" | "max"
                           # | "mean" (min is the conservative Zhu & Shu
                           # choice — larger indicator, more flagging).
gamma_low = 0.01           # Linear weight of the low-order candidate
                           # (gamma_low + gamma_high must equal 1).
gamma_high = 0.99          # Linear weight of the high-order (detail)
                           # candidate.
epsilon = 1.0e-6           # WENO-Z anti-zero epsilon.
force_troubled = false     # Diagnostic: flag every element as troubled
                           # (accuracy-acceptance tests only; never enable in
                           # production).
weno_drive_mode = "auto"   # Driver of the mr-weno reconstruction kernel:
                           # "auto" (list on unified-memory backends/OpenMP,
                           # full on separate-memory/GPU) | "list" (host
                           # compacts the flags into a dense index list —
                           # balanced heavy-only work units for the static
                           # OpenMP schedule, needs a flag readback per
                           # apply) | "full" (full-field launch, clean cells
                           # exit on one flag load — zero host readback; the
                           # readback would otherwise drain the device
                           # command queue once per stage on GPUs).
positivity = false         # Zhang & Shu positivity-preserving scaling
                           # limiter, applied to ALL steppers after any
                           # mr-weno pass: scales each element's high-order
                           # modes toward the cell mean until every volume
                           # Gauss point and face Gauss trace point satisfies
                           # rho >= eps*rhoBar and e >= eps*eBar
                           # (conservative: cell means are preserved). On
                           # the implicit (dual-time) family it additionally
                           # rides the pseudo iterations, keeping every RHS
                           # input admissible — see
                           # docs/tech_docs/positivity_limiter.md.
positivity_epsilon = 1.0e-10  # Relative positivity margin eps in
                              # rho >= eps*rhoBar, e >= eps*eBar; must lie
                              # in (0, 1).

# ---- Initial condition ----
[initial_condition]
type = "uniform"           # "uniform" (constant state from [flow]) | "expr".
# For type = "expr": primitive variables as exprtk expressions of x, y, t
# (t = 0 at the initial state), gamma and any [initial_condition.symbols]
# constants. The four expressions are independent (no cross references).
rho = "1"                  # Density expression.
u = "0"                    # X-velocity expression.
v = "0"                    # Y-velocity expression.
p = "1"                    # Pressure expression.

[initial_condition.symbols]
# User numeric constants available in the expressions above, e.g.:
# beta = 5.0

# ---- OCCA device ----
[occa]
mode = "Serial"           # "Serial", "OpenMP", "OpenCL", "CUDA", "HIP", ...
threads = 0               # OpenMP thread count; 0 keeps the OMP_NUM_THREADS
                          # environment default. Ignored by other backends.
platform = 0              # Platform index (OpenCL / dpcpp multi-platform systems).
device = 0                # Device index within the platform (also CUDA/HIP id).
opencl_o3 = true          # Append "-O3" to the OpenCL kernel build
                          # (clBuildProgram). An implementation-defined option:
                          # accepted by the clang-based OpenCL stacks
                          # (AMD / Intel / POCL), where it guards against
                          # conservative driver defaults — but NVIDIA's OpenCL
                          # implementation rejects it outright ("Don't
                          # understand command line argument \"-O3\""), making
                          # every kernel build abort. On NVIDIA GPUs set
                          # opencl_o3 = false; their compiler already optimises
                          # fully by default, so nothing is lost. Ignored by
                          # the other backends.

# ---- Output ----
[output]
enable = false            # Master switch. false (the default) produces no
                          # files at all; true writes the initial state, every
                          # `interval` steps and the final state (deduplicated).
strategy = "direct"       # "direct" (strategy A: quadrature-point SoA files,
                          # ready for post-processing) | "checkpoint"
                          # (strategy B: modal-coefficient checkpoints +
                          # mesh.h5; convert offline with CMelesConvert).
format = "hdf5"           # "hdf5" (plain archive, the default) | "xdmf"
                          # (h5 + self-contained .xmf sidecar: ParaView opens
                          # the .xmf for filled cloud maps) | "tecplot"
                          # (classic binary .plt for Tecplot 360) | "vtu"
                          # (HIGH-ORDER .vtu plus the h5 archive unless
                          # archive = false: each DG element becomes a
                          # degree-N VTK Lagrange cell carrying the exact
                          # polynomial — ParaView renders it with adaptive
                          # subdivision, smoother contours than the fixed
                          # linear sub-grid at (N+1)^2 instead of (N_q+2)^2
                          # nodes per element; open the <prefix>_series.pvd
                          # for the time axis) | "all" (all of the above).
                          # Applies to the direct strategy and to converted
                          # checkpoint output (CMelesConvert inherits it,
                          # overridable with --format).
series = true             # Maintain the <prefix>_series.xmf temporal-
                          # collection index (XDMF formats only): opening it
                          # in ParaView gives the real physical-time axis
                          # (per-step .xmf files alone carry no time values
                          # in ParaView's Xdmf3 readers). Note ParaView's
                          # PLT readers likewise never lift the V112
                          # SolutionTime into the time axis — that metadata
                          # targets Tecplot 360.
archive = true            # Write the HDF5 archive solution_<step>.h5. It is
                          # the storage backbone of "hdf5"/"xdmf" (an .xmf
                          # sidecar without its heavy data is unreadable) and
                          # the archival companion of "vtu" (whose files are
                          # self-contained). false = only the self-contained
                          # formats (vtu / plt) are produced, saving ~60%
                          # disk; a format that cannot exist without its
                          # heavy data ("hdf5", "xdmf") is then ignored with
                          # a warning at startup.
interval = 100            # Number of time steps between two outputs (>= 1
                          # when enabled).
directory = "./results"   # Output directory, created if missing.

# ---- Console logging ----
[log]
level = 1                 # Log output depth: a message prints when its depth
                          # is <= level. 0 prints nothing, 1 (default) the
                          # physical-step layer (banner, progress lines,
                          # aborts, summary), 2 the inner-iteration layer
                          # (dual-time per-step pseudo-iteration statistics);
                          # deeper layers may be added, so no upper bound.
interval = 100            # Number of time steps between two progress lines
                          # (>= 1).
