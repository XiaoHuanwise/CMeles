# CMeles 2-D Riemann problem — Lax & Liu (1998) configuration 3 in the
# ORIGINAL paper convention: quadrant split at x = 0.8, y = 0.8 on
# [0, 1]^2, presentation time T = 0.8 (Schulz-Rinne, Collins & Glaz 1993
# class S, S, S, S; the same case appears as Liska & Wendroff Table 4.3
# case 3 under the 0.5-split / T = 0.3 variant convention). All four
# quadrant-interface 1-D Riemann problems are single pure shocks — the
# star state equals the heavy quadrant exactly, by construction of the
# data — everything converges toward the heavy upper-right corner and
# the interaction rolls the shear layers into the classic double spiral
# centred at (0.8, 0.8).
#
# Boundary: free-avg (zero-gradient from the CELL MEAN) on all walls --
# the exterior state is the interior element's constant mode, the
# finite-volume edge-pad. Unlike the pointwise free trace (whose
# high-order oscillations feed the wall flux and pile up unboundedly,
# rho ~ 68 by t = 0.8) the constant mode carries no oscillation, so the
# wave systems exit cleanly through the walls.
#
# Run with:
#   ./build/CMeles config/riemann2d.toml
# then open results_riemann2d/riemann2d_series.xmf in ParaView for the
# whole time series (the .plt files go to Tecplot 360 with format =
# "tecplot"/"all").

[basis]
order = 2
nq = 4

[mesh]
nx = 96
ny = 96
x0 = 0.0
y0 = 0.0
dx = 0.0104166666666667
dy = 0.0104166666666667

[bc]
type = "free-avg"

[riemann]
flux = "llf"

[gas]
gamma = 1.4

[flow]
rho = 1.5
u = 0.0
v = 0.0
p = 1.5

[time_marching]
method = "ssprk3"
cfl = 0.18
t_final = 0.8

[initial_condition]
type = "expr"
rho = "(y < 0.8) ? ((x < 0.8) ? 0.138 : 0.5323) : ((x < 0.8) ? 0.5323 : 1.5)"
u = "(x < 0.8) ? 1.206 : 0.0"
v = "(y < 0.8) ? 1.206 : 0.0"
p = "(y < 0.8) ? ((x < 0.8) ? 0.029 : 0.3) : ((x < 0.8) ? 0.3 : 1.5)"

[limiter]
type = "mr-weno"
positivity = true

[occa]
mode = "OpenMP"

[output]
enable = true
strategy = "direct"
format = "xdmf"
interval = 400
directory = "./results_riemann2d"

[log]
level = 1
interval = 200
