# CMeles 2-D Riemann problem (Lax & Liu configuration 3, Liska & Wendroff
# Table 4.3 case 3) with the MR-WENO limiter: four-quadrant initial data on
# [0, 1]^2 whose four interface Riemann problems are all shocks (S, S, S,
# S); every quadrant flow converges toward the heavy upper-right state and
# the interaction rolls the shear layers into the classic double spiral.
#
# Free (zero-gradient) boundaries: exactly neutral while the wall-adjacent
# flow is constant. The fastest signal (lower-left diagonal stream,
# |u| + a ~ 2.25) reaches a wall at t = 0.222, so t_final = 0.2 keeps a
# 10% margin. Run with:
#   ./build/CMeles config/riemann2d.toml
# then open results_riemann2d/riemann2d_series.xmf in ParaView for the
# whole time series (or riemann2d_solution_0000600.xmf for one step; the
# .plt files go to Tecplot 360 with format = "tecplot"/"all").

[basis]
order = 2
nq = 4

[mesh]
nx = 96
ny = 96
x0 = 0.0
y0 = 0.0
dx = 0.0104166666666667
dy = 0.0104166666666667

[bc]
type = "riemann"
riemann_target = "ic"

[riemann]
flux = "llf"

[gas]
gamma = 1.4

[flow]
rho = 1.5
u = 0.0
v = 0.0
p = 1.5

[time_marching]
method = "ssprk3"
cfl = 0.18
t_final = 0.2

[initial_condition]
type = "expr"
rho = "(y < 0.5) ? ((x < 0.5) ? 0.138 : 0.5323) : ((x < 0.5) ? 0.5323 : 1.5)"
u = "(x < 0.5) ? 1.206 : 0.0"
v = "(y < 0.5) ? 1.206 : 0.0"
p = "(y < 0.5) ? ((x < 0.5) ? 0.029 : 0.3) : ((x < 0.5) ? 0.3 : 1.5)"

[limiter]
type = "mr-weno"

[occa]
mode = "OpenMP"

[output]
enable = true
strategy = "direct"
format = "xdmf"
interval = 300
directory = "./results_riemann2d"

[log]
level = 1
interval = 100
